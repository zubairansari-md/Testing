<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🥀 TEAM-ZUBAIR-MD | Bloody WhatsApp Bot Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Creepster&family=Great+Vibes&family=MedievalSharp&family=Uncial+Antiqua&display=swap" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Creepster&family=Great+Vibes&family=MedievalSharp&family=Uncial+Antiqua&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap');

        :root {
            --primary: #8B0000;
            --primary-light: #CC0000;
            --primary-dark: #4A0000;
            --blood-red: #DC143C;
            --crimson: #8B0000;
            --white: #FFFFFF;
            --white-smoke: #F5F5F5;
            --gray: #808080;
            --dark-gray: #2C2C2C;
            --black: #0A0A0A;
            --blood-dark: #1A0000;
            --blood-glow: #FF0000;
            --bg: #0A0000;
            --card-bg: #1A0A0A;
            --text: #FF4D4D;
            --muted: #990000;
            --border: #330000;
            --shadow: rgba(139, 0, 0, 0.5);
            --glow: rgba(255, 0, 0, 0.3);
        }
        
        * {
            scrollbar-width: thin;
            scrollbar-color: var(--primary) var(--bg);
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
            box-shadow: 0 0 20px var(--glow);
        }
        
        body {
            background-color: var(--bg);
            color: var(--white);
            font-family: 'Playfair Display', 'Cinzel Decorative', serif;
            background-image: 
                radial-gradient(circle at 20% 50%, var(--blood-dark) 0%, transparent 50%),
                radial-gradient(circle at 80% 50%, var(--blood-dark) 0%, transparent 50%),
                repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(139, 0, 0, 0.05) 2px, rgba(139, 0, 0, 0.05) 4px);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }
        
        /* Animated background particles */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(2px 2px at 20% 30%, rgba(255, 0, 0, 0.3), transparent),
                radial-gradient(2px 2px at 40% 70%, rgba(255, 0, 0, 0.2), transparent),
                radial-gradient(2px 2px at 60% 20%, rgba(255, 0, 0, 0.3), transparent),
                radial-gradient(2px 2px at 80% 80%, rgba(255, 0, 0, 0.2), transparent),
                radial-gradient(2px 2px at 10% 90%, rgba(255, 0, 0, 0.3), transparent),
                radial-gradient(2px 2px at 90% 10%, rgba(255, 0, 0, 0.2), transparent);
            pointer-events: none;
            z-index: 0;
            animation: particleFloat 20s infinite linear;
        }
        
        @keyframes particleFloat {
            0% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
            100% { transform: translateY(0); }
        }
        
        .navbar {
            background: linear-gradient(180deg, var(--black) 0%, var(--blood-dark) 100%);
            border-bottom: 3px solid var(--primary);
            padding: 20px 0;
            position: relative;
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.4);
            z-index: 10;
        }
        
        .navbar::after {
            content: '⚔️';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            filter: drop-shadow(0 0 20px var(--blood-glow));
            color: var(--primary);
            background: var(--black);
            padding: 0 15px;
        }
        
        .navbar-brand {
            font-family: 'Cinzel Decorative', cursive;
            font-weight: 900;
            color: var(--white) !important;
            font-size: 2.2rem;
            text-shadow: 
                0 0 30px rgba(139, 0, 0, 0.6),
                0 0 60px rgba(139, 0, 0, 0.3),
                0 0 90px rgba(139, 0, 0, 0.1);
            letter-spacing: 3px;
        }
        
        .navbar-brand i {
            color: var(--blood-red);
            animation: pulseBlood 1.5s ease-in-out infinite;
        }
        
        .navbar-brand span {
            color: var(--white);
            font-weight: 700;
        }
        
        .navbar-brand .blood-text {
            color: var(--blood-red);
        }
        
        @keyframes pulseBlood {
            0%, 100% { 
                text-shadow: 0 0 20px var(--blood-red), 0 0 40px var(--blood-red);
            }
            50% { 
                text-shadow: 0 0 40px var(--blood-red), 0 0 80px var(--blood-red), 0 0 120px var(--blood-red);
            }
        }
        
        /* Blood drip animation */
        .blood-drip {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            pointer-events: none;
            z-index: 0;
            overflow: hidden;
        }
        
        .blood-drip span {
            position: absolute;
            display: block;
            width: 2px;
            background: linear-gradient(180deg, var(--blood-red), transparent);
            animation: dripDown 8s infinite linear;
        }
        
        .blood-drip span:nth-child(1) { left: 10%; height: 80px; animation-delay: 0s; }
        .blood-drip span:nth-child(2) { left: 30%; height: 120px; animation-delay: 2s; }
        .blood-drip span:nth-child(3) { left: 50%; height: 60px; animation-delay: 4s; }
        .blood-drip span:nth-child(4) { left: 70%; height: 100px; animation-delay: 1s; }
        .blood-drip span:nth-child(5) { left: 90%; height: 90px; animation-delay: 3s; }
        
        @keyframes dripDown {
            0% { transform: translateY(-100%); opacity: 0.8; }
            50% { opacity: 0.4; }
            100% { transform: translateY(100vh); opacity: 0; }
        }
        
        .stats-card {
            background: linear-gradient(135deg, var(--blood-dark), var(--black));
            border: 2px solid var(--primary);
            border-radius: 20px;
            padding: 30px;
            margin-bottom: 25px;
            text-align: center;
            box-shadow: 
                0 0 40px rgba(139, 0, 0, 0.3),
                inset 0 0 40px rgba(139, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
            transition: 0.4s;
        }
        
        .stats-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 60px rgba(139, 0, 0, 0.5);
            border-color: var(--blood-red);
        }
        
        .stats-card::before {
            content: '⚔️';
            position: absolute;
            top: -20px;
            right: -10px;
            font-size: 80px;
            opacity: 0.08;
            transform: rotate(45deg);
        }
        
        .stats-card h3 {
            color: var(--white);
            font-size: 4rem;
            font-family: 'Cinzel Decorative', cursive;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.4);
            font-weight: 900;
        }
        
        .stats-card p {
            color: var(--gray);
            font-family: 'Great Vibes', cursive;
            font-size: 1.2rem;
            letter-spacing: 3px;
        }
        
        .post-card {
            background: linear-gradient(135deg, var(--card-bg), var(--black));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 25px;
            transition: 0.4s;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }
        
        .post-card::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 20%;
            right: 20%;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--primary), transparent);
        }
        
        .post-card:hover {
            transform: translateY(-3px);
            border-color: var(--primary);
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.15);
        }
        
        .post-card h5 {
            color: var(--white);
            font-family: 'Cinzel Decorative', cursive;
            text-shadow: 0 0 20px rgba(139, 0, 0, 0.3);
            font-weight: 700;
            letter-spacing: 1px;
        }
        
        .post-card h5 i {
            color: var(--blood-red);
        }
        
        .form-control {
            background: var(--black);
            border: 2px solid var(--border);
            color: var(--white);
            border-radius: 15px;
            padding: 12px 18px;
            font-family: 'Playfair Display', serif;
            transition: 0.3s;
        }
        
        .form-control:focus {
            background: var(--black);
            border-color: var(--blood-red);
            color: var(--white);
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.2);
        }
        
        .form-control::placeholder {
            color: var(--gray);
            font-style: italic;
        }
        
        .form-label {
            color: var(--gray);
            font-family: 'Playfair Display', serif;
            letter-spacing: 1px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--primary-light));
            border: none;
            font-family: 'Cinzel Decorative', cursive;
            font-weight: 700;
            border-radius: 15px;
            padding: 12px 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transition: 0.4s;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.3);
            color: var(--white);
        }
        
        .btn-primary:hover {
            transform: scale(1.02);
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.6);
            color: var(--white);
        }
        
        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #4A0000, #8B0000);
            border: 2px solid var(--primary);
            font-family: 'Cinzel Decorative', cursive;
            border-radius: 15px;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 0 30px rgba(139, 0, 0, 0.3);
            color: var(--white);
            transition: 0.4s;
        }
        
        .btn-danger:hover {
            background: linear-gradient(135deg, #8B0000, #CC0000);
            box-shadow: 0 0 50px rgba(139, 0, 0, 0.6);
            color: var(--white);
        }
        
        .console-body {
            background: var(--black);
            border: 2px solid var(--border);
            border-radius: 15px;
            height: 300px;
            overflow-y: auto;
            padding: 20px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: var(--blood-red);
            box-shadow: inset 0 0 60px rgba(0, 0, 0, 0.9);
        }
        
        .console-body div {
            border-bottom: 1px solid rgba(139, 0, 0, 0.1);
            padding: 4px 0;
            animation: consoleFade 0.3s ease-in;
        }
        
        @keyframes consoleFade {
            0% { opacity: 0; transform: translateX(-10px); }
            100% { opacity: 1; transform: translateX(0); }
        }
        
        .console-body div::before {
            content: '🩸 ';
            color: var(--muted);
        }
        
        .console-body::-webkit-scrollbar {
            width: 6px;
        }
        .console-body::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        .console-body::-webkit-scrollbar-track {
            background: var(--black);
        }
        
        .hidden {
            display: none !important;
        }
        
        .status-badge {
            padding: 8px 20px;
            border-radius: 30px;
            font-family: 'Cinzel Decorative', cursive;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        .connected {
            background: rgba(0, 255, 0, 0.1);
            color: #00FF00;
            border: 2px solid #00FF00;
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.2);
            animation: glowGreen 2s infinite;
        }
        
        @keyframes glowGreen {
            0%, 100% { box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
            50% { box-shadow: 0 0 40px rgba(0, 255, 0, 0.4); }
        }
        
        .disconnected {
            background: rgba(255, 0, 0, 0.1);
            color: #FF0000;
            border: 2px solid #FF0000;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2);
            animation: glowRed 2s infinite;
        }
        
        @keyframes glowRed {
            0%, 100% { box-shadow: 0 0 20px rgba(255, 0, 0, 0.2); }
            50% { box-shadow: 0 0 40px rgba(255, 0, 0, 0.4); }
        }
        
        .progress-container {
            width: 100%;
            background-color: var(--black);
            border-radius: 15px;
            margin-top: 20px;
            display: none;
            border: 2px solid var(--border);
            padding: 8px;
        }
        
        .progress-bar {
            width: 0%;
            height: 12px;
            background: linear-gradient(90deg, var(--primary), var(--blood-red), var(--blood-glow));
            border-radius: 10px;
            transition: width 0.5s ease;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.3);
        }
        
        .loading-text {
            font-size: 13px;
            color: var(--gray);
            margin-top: 8px;
            text-align: center;
            font-family: 'Great Vibes', cursive;
            letter-spacing: 1px;
        }
        
        #pairingResult {
            color: var(--blood-red) !important;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.6);
            font-size: 2rem !important;
            font-family: 'Cinzel Decorative', cursive;
            font-weight: 900;
            padding: 15px;
        }
        
        .glow-text {
            color: var(--blood-red);
            text-shadow: 0 0 30px rgba(255, 0, 0, 0.4), 0 0 60px rgba(255, 0, 0, 0.2);
        }
        
        /* Blood splatter decorative */
        .blood-splatter {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0.04;
            font-size: 100px;
            color: var(--primary);
        }
        
        .blood-splatter:nth-child(1) { top: 10%; left: 5%; transform: rotate(45deg); font-size: 80px; }
        .blood-splatter:nth-child(2) { bottom: 20%; right: 8%; transform: rotate(-30deg); font-size: 120px; }
        .blood-splatter:nth-child(3) { top: 60%; left: 2%; transform: rotate(90deg); font-size: 60px; }
        .blood-splatter:nth-child(4) { bottom: 40%; right: 2%; transform: rotate(-60deg); font-size: 90px; }
        
        .input-group .form-control {
            border-right: none;
            border-radius: 15px 0 0 15px;
        }
        
        .input-group .btn {
            border-left: none;
            border-radius: 0 15px 15px 0;
        }
        
        /* Responsive */
        @media (max-width: 768px) {
            .navbar-brand {
                font-size: 1.4rem;
                letter-spacing: 1px;
            }
            .stats-card h3 {
                font-size: 2.5rem;
            }
            .stats-card p {
                font-size: 0.9rem;
            }
            #pairingResult {
                font-size: 1.3rem !important;
            }
        }
        
        @media (max-width: 576px) {
            .navbar-brand {
                font-size: 1rem;
            }
            .post-card {
                padding: 15px;
            }
            .console-body {
                height: 200px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <!-- Blood Splatter Background -->
    <div class="blood-splatter">⚔️</div>
    <div class="blood-splatter">🩸</div>
    <div class="blood-splatter">⚔️</div>
    <div class="blood-splatter">🩸</div>
    
    <!-- Blood Drip Animation -->
    <div class="blood-drip">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav class="navbar">
        <div class="container">
            <a class="navbar-brand" href="#">
                <i class="fas fa-skull me-3"></i>
                <span class="blood-text">⚔️</span> TEAM-ZUBAIR <span class="blood-text">⚔️</span>
                <i class="fas fa-dragon ms-3" style="color: var(--blood-red);"></i>
            </a>
        </div>
    </nav>

    <div class="container mt-4" style="position: relative; z-index: 1;">
        <div class="stats-card">
            <h3 id="totalActive">0</h3>
            <p class="mb-0">
                <i class="fas fa-skull-crossbones me-2"></i>
                ACTIVE BOT INSTANCES
                <i class="fas fa-skull-crossbones ms-2"></i>
            </p>
        </div>

        <div id="setupSection">
            <div class="post-card">
                <h5 class="mb-3">
                    <i class="fas fa-plus-circle me-2"></i>
                    SUMMON THE BOT
                </h5>
                <div class="input-group mb-3">
                    <input type="text" id="userIdInput" class="form-control" placeholder="Enter Bot Name (e.g., DarkSoul)">
                    <button class="btn btn-primary" onclick="selectUser()">
                        <i class="fas fa-skull me-2"></i>CREATE
                    </button>
                </div>
            </div>
        </div>

        <div id="userDashboard" class="hidden">
            <div id="stage1">
                <div class="post-card">
                    <h5>
                        <i class="fas fa-link me-2"></i>
                        PAIRING RITUAL
                    </h5>
                    <div class="mb-3">
                        <label class="form-label">
                            <i class="fas fa-phone me-2"></i>WhatsApp Number (with country code)
                        </label>
                        <input type="tel" class="form-control" id="pairNumber" placeholder="923001234567">
                    </div>
                    <button class="btn btn-primary w-100" id="pairBtn">
                        <i class="fas fa-skull-crossbones me-2"></i>GENERATE CODE
                    </button>
                    
                    <div id="progressContainer" class="progress-container">
                        <div id="progressBar" class="progress-bar"></div>
                        <div class="loading-text">⏳ Summoning the dark forces... Please wait.</div>
                    </div>

                    <div id="pairingResult" class="mt-3 text-center"></div>
                </div>
            </div>

            <div id="stage2" class="hidden">
                <div class="post-card d-flex justify-content-between align-items-center">
                    <div>
                        <span id="connectionStatus" class="status-badge disconnected">
                            <i class="fas fa-circle me-1"></i>DISCONNECTED
                        </span>
                        <span class="ms-2" id="activeBotName" style="color: var(--gray); font-family: 'Cinzel Decorative', cursive;"></span>
                    </div>
                    <button class="btn btn-danger btn-sm" id="logoutBtn">
                        <i class="fas fa-skull me-2"></i>BANISH
                    </button>
                </div>
                <div class="post-card">
                    <h5>
                        <i class="fas fa-terminal me-2"></i>
                        DARK CONSOLE
                    </h5>
                    <div class="console-body" id="console"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <script>
        const socket = io();
        let currentUserId = null;

        function selectUser() {
            const userId = document.getElementById('userIdInput').value.trim();
            if (!userId) return alert('⚠️ Enter a bot name first!');
            currentUserId = userId;
            socket.emit('set-user', userId);
            document.getElementById('activeBotName').innerHTML = `<i class="fas fa-skull me-2"></i>⚔️ ${userId}`;
            document.getElementById('userDashboard').classList.remove('hidden');
            document.getElementById('stage1').classList.remove('hidden');
            document.getElementById('stage2').classList.add('hidden');
            document.getElementById('pairingResult').innerHTML = '';
        }

        socket.on('total-active', (count) => {
            document.getElementById('totalActive').innerText = count;
        });

        socket.on('pairing-code', (code) => {
            document.getElementById('progressContainer').style.display = 'none';
            document.getElementById('pairingResult').innerHTML = `
                <i class="fas fa-skull-crossbones me-3"></i>
                ⚔️ ${code} ⚔️
                <i class="fas fa-skull-crossbones ms-3"></i>
            `;
        });

        socket.on('console', (log) => {
            const consoleDiv = document.getElementById('console');
            const entry = document.createElement('div');
            const time = new Date().toLocaleTimeString();
            entry.innerHTML = `[${time}] 🩸 ${log.message}`;
            consoleDiv.appendChild(entry);
            consoleDiv.scrollTop = consoleDiv.scrollHeight;
        });

        socket.on('connection-status', (status) => {
            const badge = document.getElementById('connectionStatus');
            if (status.connected) {
                badge.className = 'status-badge connected';
                badge.innerHTML = '<i class="fas fa-circle me-1"></i>CONNECTED';
                document.getElementById('stage1').classList.add('hidden');
                document.getElementById('stage2').classList.remove('hidden');
                document.getElementById('progressContainer').style.display = 'none';
            } else {
                badge.className = 'status-badge disconnected';
                badge.innerHTML = '<i class="fas fa-circle me-1"></i>DISCONNECTED';
            }
        });

        let isPairing = false;
        document.getElementById('pairBtn').onclick = () => {
            if (isPairing) return;
            const number = document.getElementById('pairNumber').value;
            if (!number) return alert('⚠️ Enter a WhatsApp number first!');
            
            isPairing = true;
            document.getElementById('pairBtn').disabled = true;
            
            const progressContainer = document.getElementById('progressContainer');
            const progressBar = document.getElementById('progressBar');
            const pairingResult = document.getElementById('pairingResult');
            
            pairingResult.innerHTML = '';
            progressContainer.style.display = 'block';
            progressBar.style.width = '0%';
            
            let width = 0;
            const interval = setInterval(() => {
                if (width >= 90) {
                    clearInterval(interval);
                } else {
                    width += 2;
                    progressBar.style.width = width + '%';
                }
            }, 100);

            socket.emit('pair-request', { userId: currentUserId, number });
            
            setTimeout(() => {
                isPairing = false;
                document.getElementById('pairBtn').disabled = false;
            }, 10000);
        };

        document.getElementById('logoutBtn').onclick = () => {
            if (confirm('⚠️ Are you sure you want to banish the bot?')) {
                socket.emit('logout', currentUserId);
            }
        };
    </script>
</body>
</html>
